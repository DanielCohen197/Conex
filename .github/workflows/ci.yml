name: CI
 
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
 
jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
 
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
            std: c++17
          - os: ubuntu-latest
            compiler: clang++
            std: c++17
          - os: windows-latest
            compiler: msvc
            std: c++17
          - os: macos-latest
            compiler: clang++
            std: c++17
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      # ── Linux / macOS ──────────────────────────────────────────────
      - name: Build and run example (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.compiler }} -std=${{ matrix.std }} \
            -Wall -Wextra -Wpedantic \
            -I Include \
            Example/Example.cpp \
            -o conex_example
          ./conex_example
 
      # ── Windows (MSVC via Developer Command Prompt) ────────────────
      - name: Build and run example (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /std:c++17 /W4 /EHsc /I Include Example\Example.cpp /Fe:conex_example.exe
          conex_example.exe
 
